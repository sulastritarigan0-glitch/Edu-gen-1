<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGen AI - AI Quiz & Exam Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans text-gray-800">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-700 mb-2"><i class="fas fa-brain mr-2"></i>EduGen AI</h1>
            <p class="text-gray-600">Generator Soal Otomatis & Pembahasan Cerdas</p>
        </header>

        <!-- Setup Form -->
        <div id="setup-section" class="glassmorphism p-8 shadow-xl mb-8">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2">Buat Soal Baru</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2">Jenjang Pendidikan</label>
                    <select id="jenjang" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="SD">SD (Sekolah Dasar)</option>
                        <option value="SMP">SMP (Sekolah Menengah Pertama)</option>
                        <option value="SMA">SMA (Sekolah Menengah Atas)</option>
                        <option value="UTBK/SNBT">UTBK / SNBT (Persiapan Kuliah)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Topik / Mata Pelajaran</label>
                    <input type="text" id="topik" placeholder="Contoh: Hukum Newton, Sejarah Kemerdekaan RI..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Jumlah Soal</label>
                    <input type="number" id="jumlah" value="3" min="1" max="10" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <button onclick="generateSoal()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                <i class="fas fa-magic mr-2"></i> Ciptakan Soal Sekarang
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-indigo-600 mb-4"></div>
            <p class="text-lg font-semibold text-indigo-700 animate-pulse">AI sedang menyusun soal & pembahasan... Mohon tunggu.</p>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="hidden glassmorphism p-8 shadow-xl mb-8">
            <div id="quiz-container"></div>
            <button onclick="submitQuiz()" class="mt-8 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                <i class="fas fa-check-circle mr-2"></i> Selesai & Lihat Hasil
            </button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden glassmorphism p-8 shadow-xl mb-8">
            <div class="text-center mb-8 border-b pb-6">
                <h2 class="text-3xl font-bold text-gray-800">Skor Kamu</h2>
                <div id="score-display" class="text-6xl font-extrabold text-indigo-600 mt-4">0/100</div>
            </div>
            <h3 class="text-xl font-bold mb-4"><i class="fas fa-book-open mr-2"></i>Pembahasan Lengkap</h3>
            <div id="review-container" class="space-y-6"></div>
            
            <div class="mt-8 flex gap-4">
                <button onclick="location.reload()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-lg transition duration-200">
                    <i class="fas fa-redo mr-2"></i> Buat Soal Lain
                </button>
                <button onclick="exportToJSON()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    <i class="fab fa-github mr-2"></i> Ekspor ke GitHub (Jules AI)
                </button>
            </div>
        </div>
    </div>

    <script>
        // API Key dari user
        const API_KEY = "AQ.Ab8RN6KnjCLl0DlaFOODURspfTN2F1I9G1vpwCAwPpRrdSVzVg"; 
        
        let currentQuestions = [];
        let userAnswers = [];

        async function generateSoal() {
            const jenjang = document.getElementById('jenjang').value;
            const topik = document.getElementById('topik').value;
            const jumlah = document.getElementById('jumlah').value;

            if (!topik) return alert('Mohon isi topik/mata pelajaran terlebih dahulu!');

            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // Prompt khusus untuk AI agar formatnya bisa kita parse jadi HTML
            const prompt = `Buatkan ${jumlah} soal pilihan ganda tingkat ${jenjang} dengan topik "${topik}". 
            Wajib kembalikan HANYA dalam format JSON valid (tanpa markdown blok, tanpa awalan/akhiran text) dengan struktur array of object persis seperti ini:
            [
              {
                "soal": "Pertanyaan di sini...",
                "opsi": ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"],
                "jawabanBenar": indexAngkaDari0Sampai3,
                "penjelasan": {
                   "konsep": "Konsep dasar/teori dari soal ini",
                   "langkah": "Langkah-langkah detail pengerjaan",
                   "tips": "Tips atau cara cepat menjawab"
                }
              }
            ]`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                
                // Membersihkan markdown dari respons AI
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                currentQuestions = JSON.parse(rawText);
                userAnswers = new Array(currentQuestions.length).fill(null);
                renderQuiz();
                
            } catch (error) {
                alert("Gagal mengambil soal dari AI. Pastikan topik spesifik dan koneksi internet stabil.\nDetail error di console.");
                console.error(error);
                location.reload();
            }
        }

        function renderQuiz() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuestions.forEach((q, index) => {
                let html = `
                    <div class="mb-8 p-6 bg-white rounded-xl shadow-sm border border-gray-100">
                        <p class="font-bold text-lg mb-4"><span class="text-indigo-600">Soal ${index + 1}.</span> ${q.soal}</p>
                        <div class="space-y-3">
                `;
                
                q.opsi.forEach((opsi, optIndex) => {
                    html += `
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-indigo-50 transition ${userAnswers[index] === optIndex ? 'bg-indigo-100 border-indigo-500' : ''}" onclick="selectAnswer(${index}, ${optIndex})">
                            <input type="radio" name="soal${index}" value="${optIndex}" class="hidden">
                            <span class="w-8 h-8 flex items-center justify-center rounded-full border-2 border-indigo-200 text-indigo-600 font-bold mr-4">${String.fromCharCode(65 + optIndex)}</span>
                            <span class="text-gray-700">${opsi}</span>
                        </label>
                    `;
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function selectAnswer(questionIndex, optionIndex) {
            userAnswers[questionIndex] = optionIndex;
            // Re-render sedikit brutal tapi efektif untuk update UI class
            renderQuiz(); 
            
            // Re-check radio
            const radios = document.getElementsByName(`soal${questionIndex}`);
            if(radios[optionIndex]) radios[optionIndex].checked = true;
        }

        function submitQuiz() {
            if(userAnswers.includes(null)) {
                if(!confirm("Masih ada soal yang belum dijawab. Yakin ingin mengakhiri?")) return;
            }

            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            let correctCount = 0;
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            currentQuestions.forEach((q, index) => {
                const isCorrect = userAnswers[index] === q.jawabanBenar;
                if (isCorrect) correctCount++;

                const userAnswerText = userAnswers[index] !== null ? q.opsi[userAnswers[index]] : "Tidak dijawab";
                const correctAnswerText = q.opsi[q.jawabanBenar];

                reviewContainer.innerHTML += `
                    <div class="p-6 rounded-xl border-2 ${isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}">
                        <div class="flex justify-between items-start mb-4">
                            <p class="font-bold text-lg">Soal ${index + 1}</p>
                            <span class="px-3 py-1 rounded-full text-sm font-bold ${isCorrect ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">
                                ${isCorrect ? 'BENAR' : 'SALAH'}
                            </span>
                        </div>
                        <p class="text-gray-800 mb-4">${q.soal}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="p-3 bg-white rounded-lg border border-gray-200">
                                <span class="block text-xs text-gray-500 font-bold mb-1">Jawaban Kamu:</span>
                                <span class="${isCorrect ? 'text-green-600 font-semibold' : 'text-red-600 font-semibold'}">${userAnswerText}</span>
                            </div>
                            <div class="p-3 bg-white rounded-lg border border-gray-200">
                                <span class="block text-xs text-gray-500 font-bold mb-1">Kunci Jawaban:</span>
                                <span class="text-gray-800 font-semibold">${correctAnswerText}</span>
                            </div>
                        </div>
                        
                        <!-- Penjelasan Section -->
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-indigo-100">
                            <h4 class="font-bold text-indigo-700 border-b pb-2 mb-3"><i class="fas fa-lightbulb mr-2"></i>Penjelasan & Analisis</h4>
                            
                            <div class="mb-3">
                                <span class="font-semibold text-gray-700 text-sm">Konsep Utama:</span>
                                <p class="text-gray-600 text-sm mt-1">${q.penjelasan.konsep}</p>
                            </div>
                            
                            <div class="mb-3">
                                <span class="font-semibold text-gray-700 text-sm">Langkah Penyelesaian / Analisis:</span>
                                <p class="text-gray-600 text-sm mt-1">${q.penjelasan.langkah}</p>
                            </div>
                            
                            <div class="p-3 bg-yellow-50 rounded border border-yellow-200 mt-4">
                                <span class="font-bold text-yellow-800 text-sm"><i class="fas fa-star mr-1"></i>Tips & Trik:</span>
                                <p class="text-yellow-700 text-sm mt-1">${q.penjelasan.tips}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            const finalScore = Math.round((correctCount / currentQuestions.length) * 100);
            document.getElementById('score-display').innerText = `${finalScore}`;
        }

        // Fitur ekspor untuk GitHub & Jules AI
        function exportToJSON() {
            const dataToExport = {
                metadata: {
                    topik: document.getElementById('topik').value,
                    jenjang: document.getElementById('jenjang').value,
                    timestamp: new Date().toISOString()
                },
                bankSoal: currentQuestions
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", `bank_soal_${dataToExport.metadata.topik.replace(/\s+/g, '_')}.json`);
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
